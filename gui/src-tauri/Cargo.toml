[package]
name = "proxiflare"
version = "0.4.1"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
# HTTP client for fetching proxies from provider APIs (proxy-cheap, etc.)
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
async-trait = "0.1"
thiserror = "1"
signal-hook = "0.3"

[profile.release]
strip = true
lto = true
opt-level = "s"
